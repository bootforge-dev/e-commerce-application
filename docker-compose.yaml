services:
  product-db:
    image: mysql:8.4
    container_name: product
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    ports:
      - "3306:3306"
    volumes:
      - product_data:/var/lib/mysql

  inventory-db:
    image: mysql:8.4
    container_name: inventory
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    volumes:
      - inventory_data:/var/lib/mysql
volumes:
  product_data:
  inventory_data: